# Catalog job pipeline — sequential SKU generation job execution, then mark the parent job COMPLETED.
#
# Triggered by POST /api/jobs after DB rows are created. Argument shape:
#   {
#     "job_external_id": "<uuid>",
#     "sku_generation_job_external_ids": ["<uuid>", ...]
#   }
#
# Brand comes from job.brand_id (brand.external_id) set at create time — not passed here.
#
# Machine auth is loaded from Secret Manager secret `catalog-service-cloud-secret`:
#   { "client_id": "...", "client_token": "..." }
# and sent as headers `client-id` / `client-token` on every catalog API call.
#
# Workflow SA needs roles/secretmanager.secretAccessor on that secret.
# Execute is retried once on transient HTTP failures (including 500 — our API
# surfaces OpenRouter/provider blips that way). Still no continue-on-error across SKUs.

main:
  params: [args]
  steps:
    - init:
        assign:
          - api_base_url: "https://studio.opptra.com"
          - job_external_id: ${args.job_external_id}
          - sku_generation_job_external_ids: ${args.sku_generation_job_external_ids}
          - cloud_secret_id: "catalog-service-cloud-secret"

    - fetch_cloud_secret:
        call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
        args:
          secret_id: ${cloud_secret_id}
          version: "latest"
          project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
        result: cloud_secret_raw

    - parse_credentials:
        assign:
          - cloud_credentials: ${json.decode(cloud_secret_raw)}
          - client_id: ${cloud_credentials.client_id}
          - client_token: ${cloud_credentials.client_token}

    - execute_sku_generation_jobs:
        parallel:
          concurrency_limit: 3
          for:
            value: sku_generation_job_external_id
            in: ${sku_generation_job_external_ids}
            steps:
              # Per-SKU execute: 10 minutes (must stay ≤ LB + nginx proxy timeouts).
              # One retry covers transient provider/LB failures; execute re-runs
              # only PENDING/FAILED tasks so a retry is safe.
              - call_execute_sku_generation_job:
                  try:
                    call: http.post
                    args:
                      url: ${api_base_url + "/api/jobs/sku/" + string(sku_generation_job_external_id) + "/execute/internal"}
                      timeout: 600
                      headers:
                        Content-Type: "application/json"
                        client-id: ${client_id}
                        client-token: ${client_token}
                    result: execute_result
                  retry:
                    predicate: ${retry_execute_http_error}
                    max_retries: 1
                    backoff:
                      initial_delay: 30
                      max_delay: 30
                      multiplier: 1.0

    # Parent complete is fast; keep under the same 10-minute stack ceiling.
    - complete_job:
        call: http.post
        args:
          url: ${api_base_url + "/api/jobs/" + string(job_external_id) + "/complete/internal"}
          timeout: 600
          headers:
            Content-Type: "application/json"
            client-id: ${client_id}
            client-token: ${client_token}
        result: complete_result

    - done:
        return:
          job_external_id: ${job_external_id}
          status: ${complete_result.body.status}

# Retry transient HTTP failures from execute. Include 500: the catalog API maps
# provider/image failures (e.g. OpenRouter 503) to HTTP 500 with FAILED tasks,
# and a second execute attempt re-runs only those incomplete tasks.
retry_execute_http_error:
  params: [e]
  steps:
    - decide:
        switch:
          - condition: ${e.code == 429}
            return: true
          - condition: ${e.code == 500}
            return: true
          - condition: ${e.code == 502}
            return: true
          - condition: ${e.code == 503}
            return: true
          - condition: ${e.code == 504}
            return: true
        next: no_retry
    - no_retry:
        return: false
