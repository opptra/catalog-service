# Cloud Build: fetch client secret → build/push images → replace MIG VMs.
#
# Secrets (JSON object of env keys), latest version:
#   catalog-service-client  → baked into client image via client/.env (build-time)
#   catalog-service-server  → read on VM by instance startup (not SCP'd by deploy)
#
# Substitutions:
#   _REGION, _AR_REPO, _MIG_NAME, _MIG_REGION (regional MIG)
#   _CLIENT_SECRET, _SERVER_SECRET  (optional overrides)
#   For a zonal MIG, set _MIG_REGION empty and pass MIG_ZONE via script env instead.

substitutions:
  _REGION: asia-south1
  _AR_REPO: catalog-service
  _MIG_NAME: catalog-service-ig
  _MIG_REGION: asia-south1
  _CLIENT_SECRET: catalog-service-client
  _SERVER_SECRET: catalog-service-server

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-client:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-client:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-server:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-server:latest

steps:
  # 1) Pull env JSON from Secret Manager and write dotenv files
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: fetch-secrets
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        chmod +x scripts/fetch-secrets.sh
        export CLIENT_SECRET_NAME="${_CLIENT_SECRET}"
        export SERVER_SECRET_NAME="${_SERVER_SECRET}"
        ./scripts/fetch-secrets.sh

  # 2) Build client (Vite reads client/.env from secrets)
  - name: gcr.io/cloud-builders/docker
    id: build-client
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-client:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-client:latest
      - ./client
    waitFor: [fetch-secrets]

  # 3) Build server (runtime secrets are NOT baked into the image)
  - name: gcr.io/cloud-builders/docker
    id: build-server
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-server:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-server:latest
      - ./server
    waitFor: [fetch-secrets]

  - name: gcr.io/cloud-builders/docker
    id: push-client
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-client
    waitFor: [build-client]

  - name: gcr.io/cloud-builders/docker
    id: push-server
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-server
    waitFor: [build-server]

  # 4) Replace MIG VMs; startup pulls :latest and loads server secret
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        chmod +x scripts/deploy-gce.sh
        export PROJECT_ID="${PROJECT_ID}"
        export MIG_NAME="${_MIG_NAME}"
        export MIG_REGION="${_MIG_REGION}"
        ./scripts/deploy-gce.sh
    waitFor: [push-client, push-server]
