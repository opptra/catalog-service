# Cloud Build: fetch catalog-service secret → build/push images → deploy
# Cloud Workflows → replace MIG VMs.
#
# Secret (JSON with client + server sections), latest version:
#   catalog-service
#     .client → baked into client image via client/.env (build-time)
#     .server → read on VM by instance startup (not SCP'd by deploy)
#
# Substitutions:
#   _REGION, _AR_REPO, _MIG_NAME, _MIG_REGION
#   Deploy targets a regional MIG (zone-agnostic). Create the MIG with
#   --region=asia-south1 (not --zone=...).
#   _SECRET_NAME  (optional override; default catalog-service)
#   _WORKFLOWS_LOCATION  (default asia-south1; must match server WORKFLOWS_LOCATION)
#   Workflow executions use the default Compute Engine SA (grant it Secret Manager access).

substitutions:
  _REGION: asia-south1
  _AR_REPO: catalog-service
  _MIG_NAME: catalog-service
  _MIG_REGION: asia-south1
  _SECRET_NAME: catalog-service
  _WORKFLOWS_LOCATION: asia-south1

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-client:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-client:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-server:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-server:latest

steps:
  # 1) Pull env JSON from Secret Manager and write dotenv files
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: fetch-secrets
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        chmod +x scripts/fetch-secrets.sh
        export SECRET_NAME="${_SECRET_NAME}"
        ./scripts/fetch-secrets.sh

  # 2) Build client (Vite reads client/.env from secrets)
  - name: gcr.io/cloud-builders/docker
    id: build-client
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-client:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-client:latest
      - ./client
    waitFor: [fetch-secrets]

  # 3) Build server (runtime secrets are NOT baked into the image)
  - name: gcr.io/cloud-builders/docker
    id: build-server
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-server:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-server:latest
      - ./server
    waitFor: [fetch-secrets]

  - name: gcr.io/cloud-builders/docker
    id: push-client
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-client
    waitFor: [build-client]

  - name: gcr.io/cloud-builders/docker
    id: push-server
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/catalog-server
    waitFor: [build-server]

  # 4) Deploy Cloud Workflows (YAML under cloud-workflows/; parallel with image builds)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-workflows
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        chmod +x scripts/deploy-workflows.sh
        export PROJECT_ID="${PROJECT_ID}"
        export WORKFLOWS_LOCATION="${_WORKFLOWS_LOCATION}"
        ./scripts/deploy-workflows.sh
    waitFor: ["-"]

  # 5) Replace MIG VMs; startup pulls :latest and loads server section of secret
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        chmod +x scripts/deploy-gce.sh
        export PROJECT_ID="${PROJECT_ID}"
        export MIG_NAME="${_MIG_NAME}"
        export MIG_REGION="${_MIG_REGION}"
        ./scripts/deploy-gce.sh
    waitFor: [push-client, push-server]
